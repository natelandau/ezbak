---
# https://pre-commit.com
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: "https://github.com/commitizen-tools/commitizen"
    rev: v4.19.2
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push

  - repo: "https://github.com/pre-commit/pygrep-hooks"
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: .devcontainer/|.vscode/
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
        types: [python]
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        types: [python]

  - repo: "https://github.com/adrienverge/yamllint.git"
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: ^.*\.(yaml|yml)$
        entry: yamllint --strict --config-file .yamllint.yml

  # Checks the commit message only; the tree is checked by the local typos hook
  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: v1.51.1
    hooks:
      - id: typos
        name: typos (commit message)
        args: ["--force-exclude"]
        stages: [commit-msg]

  - repo: "https://github.com/crate-ci/committed"
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: "https://github.com/gitleaks/gitleaks"
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # These hooks call duty recipes, which wrap each gate in gate-cache, so a hook,
  # `duty lint`, and an agent share markers and skip work that already passed.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run duty ruff
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run duty format
        language: system
        pass_filenames: false
        types: [python]

      - id: typos
        name: typos
        entry: uv run duty typos
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run duty mypy
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          src/|
          uv\.lock|
          pyproject\.toml
          )

      - id: pytest
        name: pytest
        entry: uv run duty test
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          src/|
          tests/|
          uv\.lock|
          pyproject\.toml
          )

      - id: zensical-build
        name: zensical-build
        entry: uv run gate-cache -- zensical build --strict
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          docs/|
          zensical\.toml
          )

---
# https://prek.j178.dev
# `repo: builtin` hooks are specific to prek and do not run under pre-commit.
minimum_prek_version: "0.5.12"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: "https://github.com/commitizen-tools/commitizen"
    rev: v4.20.1
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push

  # Ruff covers the Python checks this repo also ships (eval, mock methods, logger.warn)
  - repo: "https://github.com/pre-commit/pygrep-hooks"
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: text-unicode-replacement-char

  # Ruff covers check-ast, check-builtin-literals, check-docstring-first, and debug-statements
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      # The release tooling regenerates CHANGELOG.md, so hooks must not rewrite it
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^CHANGELOG\.md$
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$

  - repo: "https://github.com/adrienverge/yamllint.git"
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Checks the commit message only; the tree is checked by the local typos hook
  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: v1.52.2
    hooks:
      - id: typos
        name: typos (commit message)
        args: ["--force-exclude"]
        stages: [commit-msg]

  - repo: "https://github.com/crate-ci/committed"
    rev: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: "https://github.com/gitleaks/gitleaks"
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Audits GitHub workflows, Dependabot, actions, and this file for security issues
  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: v1.33.1
    hooks:
      - id: zizmor
        # Informational findings are suggestions, so only low severity and up fail the hook
        args: [--no-progress, --min-severity, low]

  # Checks workflow syntax, action inputs, and expressions. Lints `run:` scripts
  # only when shellcheck is installed.
  - repo: "https://github.com/Mateusz-Grzelinski/actionlint-py"
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # These hooks call duty recipes, which wrap the slower gates in gate-cache, so a
  # hook, `duty lint`, and an agent share markers and skip work that already passed.
  # Each `files` pattern lists the tool's config too, so a settings change reruns it.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run duty ruff
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$

      - id: ruff-format
        name: ruff format
        entry: uv run duty format
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$

      - id: typos
        name: typos
        entry: uv run duty typos
        language: system
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run duty ty
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          src/|
          tests/|
          uv\.lock|
          pyproject\.toml
          )

      - id: pytest
        name: pytest
        entry: uv run duty test
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          src/|
          tests/|
          duties\.py|
          uv\.lock|
          pyproject\.toml
          )

      - id: zensical-build
        name: zensical-build
        entry: uv run gate-cache --name docs --path docs/ --path zensical.toml --path uv.lock -- zensical build --strict
        language: system
        pass_filenames: false
        files: |
          (?x)^(
          docs/|
          zensical\.toml|
          uv\.lock
          )

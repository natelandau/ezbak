[project]
    authors = [{ name = "Nate Landau", email = "github@natelandau.com" }]
    classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Environment :: Console",
        "Intended Audience :: System Administrators",
        "Operating System :: POSIX",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: System :: Archiving :: Backup",
        "Typing :: Typed",
    ]
    dependencies = [
        "apscheduler>=3.11.3,<4.0.0",
        "boto3>=1.44.12,<2.0.0",
        "cappa>=0.33.0,<1.0.0",
        "loguru>=0.8.0,<1.0.0",
        "nclutils>=4.0.0,<5.0.0",
        "pydantic-settings>=2.16.3,<3.0.0",
        "pydantic>=2.14.4,<3.0.0",
        "rich>=15.0.0,<16.0.0",
        "whenever>=0.11.0,<1.0.0",
    ]
    description = "Back up and restore files and directories as tar.gz archives on local disks and S3, with retention policies."
    keywords = ["archive", "backup", "docker", "restore", "s3"]
    license = "MIT"
    license-files = ["LICENSE"]
    name = "ezbak"
    readme = "README.md"
    requires-python = ">=3.11"
    version = "1.5.1"

    [project.urls]
        Changelog     = "https://github.com/natelandau/ezbak/blob/main/CHANGELOG.md"
        Documentation = "https://natelandau.github.io/ezbak/"
        Homepage      = "https://github.com/natelandau/ezbak"
        Issues        = "https://github.com/natelandau/ezbak/issues"
        Repository    = "https://github.com/natelandau/ezbak"

    [project.scripts]
        ezbak = "ezbak.cli:main"

[dependency-groups]
    dev = [
        "commitizen>=4.20.1",
        "coverage>=7.17.5",
        "duty>=1.10.1",
        "gate-cache>=0.12.0",
        "moto[s3]>=5.2.6",
        "prek>=0.5.12",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-devtools>=1.3.0",
        "pytest-mock>=3.17.0",
        "pytest-randomly>=5.1.0",
        "pytest-sugar>=1.1.1",
        "pytest>=9.2.0",
        "ruff>=0.17.6",
        "time-machine>=3.6.0",
        "ty>=0.0.112",
        "typos>=1.52.2",
        "zensical>=0.1.3",
    ]

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.13.0,<0.14"]

[tool.commitizen]
    bump_message               = "bump(release): v${current_version} → v${new_version}"
    changelog_merge_prerelease = true
    tag_format                 = "v${version}"
    update_changelog_on_bump   = true
    version_files              = ["src/ezbak/constants.py:__version__"]
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_also = ["assert_never", "def __repr__", "if TYPE_CHECKING:"]
    fail_under   = 90
    precision    = 1
    show_missing = true
    skip_covered = true
    skip_empty   = true

[tool.coverage.run]
    branch    = true
    data_file = ".cache/.coverage"
    source    = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.ty.src] # https://docs.astral.sh/ty/reference/configuration/
    include = ["src", "tests"]

[tool.ty.terminal]
    error-on-warning = true

[tool.pytest] # https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref
    # --doctest-modules imports every module under src/, so a module that fails to import
    # fails the suite even when no test touches it
    addopts             = ["-ra", "--doctest-modules"]
    cache_dir           = ".cache/pytest"
    doctest_optionflags = ["IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
    # Dump every thread's stack if a test hangs, since the container tests drive the
    # scheduler thread and signal handlers. This only reports and never fails a test.
    faulthandler_timeout = 60
    filterwarnings = [
        "error",
        # EZBak removes its staging directory through the TemporaryDirectory finalizer by design
        "ignore:Implicitly cleaning up <TemporaryDirectory:ResourceWarning",
        # cappa enters every resolved argument that has __enter__, and on Python 3.11 and
        # 3.12 a Path still has one. Remove once 3.12 is no longer supported.
        "ignore:pathlib.Path.__enter__\\(\\) is deprecated:DeprecationWarning",
    ]
    # pytest-randomly is left out so `-p no:randomly` can turn off random order while debugging
    required_plugins = ["pytest-cov", "pytest-devtools", "pytest-mock", "time-machine"]
    strict           = true
    testpaths        = ["src", "tests"]

    # pytest-devtools: a fixed terminal width keeps rich output stable for capsys assertions
    capsys_strip_tmp_path = true
    set_columns           = true

[tool.ruff] # https://docs.astral.sh/ruff/settings/
    fix           = true
    line-length   = 100
    output-format = "grouped"
    src           = ["src", "tests"]

    [tool.ruff.lint]
        ignore = [
            "line-contains-todo",
            "line-too-long",                  # the formatter owns line length
            "missing-copyright-notice",
            "missing-todo-author",
            "missing-todo-link",
            "missing-trailing-comma",         # conflicts with the formatter
            "multi-line-summary-second-line", # conflicts with multi-line-summary-first-line
            "undocumented-public-init",       # the class docstring documents construction
        ]
        preview = true
        select = ["ALL"]
        unfixable = ["commented-out-code", "unused-import", "unused-variable"]

        [tool.ruff.lint.flake8-type-checking]
            # cappa reads command annotations at runtime, so their imports must stay at runtime
            runtime-evaluated-decorators = ["cappa.base.command"]

        [tool.ruff.lint.per-file-ignores]
            "tests/*.py" = [
                "assert",
                "commented-out-code",
                "hardcoded-password-func-arg",
                "hardcoded-sql-expression",
                "hardcoded-temp-file",
                "import-private-name",
                "magic-value-comparison",
                "missing-return-type-private-function",
                "missing-return-type-public-function",
                "missing-type-function-argument",
                "private-member-access",
                "subprocess-without-shell-equals-true",
                "suspicious-subprocess-import",
                "unused-function-argument",
                # pytest passes fixtures as arguments, so test signatures grow with fixtures
                "no-self-use",
                "too-many-arguments",
                "too-many-positional-arguments",
                "unused-method-argument",
            ]

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 6

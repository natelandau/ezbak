---
name: "Tests"

on:
    workflow_dispatch:
    push:
        paths:
            - ".github/actions/**"
            - ".github/workflows/reusable-tests.yml"
            - ".github/workflows/test.yml"
            - "**.py"
            - ".dockerignore"
            - ".pre-commit-config.yaml"
            - ".typos.toml"
            - ".yamllint.yml"
            - "compose.yml"
            - "Dockerfile"
            - "pyproject.toml"
            - "uv.lock"
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
        paths:
            - ".github/actions/**"
            - ".github/workflows/reusable-tests.yml"
            - ".github/workflows/test.yml"
            - "**.py"
            - ".dockerignore"
            - ".pre-commit-config.yaml"
            - ".typos.toml"
            - ".yamllint.yml"
            - "compose.yml"
            - "Dockerfile"
            - "pyproject.toml"
            - "uv.lock"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    run-tests:
        if: ${{ !contains(github.event.head_commit.message, 'bump(release)') }}
        uses: ./.github/workflows/reusable-tests.yml
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
            run-coverage: true

    test-build-container:
        if: ${{ !contains(github.event.head_commit.message, 'bump(release)') }}
        runs-on: ubuntu-latest
        needs: run-tests
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 2 # Need at least 2 commits to compare

            # A dependency change can break the arm64 build as easily as a Dockerfile change
            - name: Check if the image inputs changed
              id: dockerfile-changes
              run: |
                  if git diff --name-only HEAD~1 HEAD | grep -qE '^(Dockerfile|\.dockerignore|uv\.lock)$'; then
                    echo "dockerfile=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "dockerfile=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up QEMU
              if: steps.dockerfile-changes.outputs.dockerfile == 'true'
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              if: steps.dockerfile-changes.outputs.dockerfile == 'true'
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build multi-arch Docker image
              if: steps.dockerfile-changes.outputs.dockerfile == 'true'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  outputs: type=cacheonly
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

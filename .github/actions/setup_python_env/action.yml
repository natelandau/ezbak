---
name: Install uv, Python, and project dependencies
description: Install uv, Python, and project dependencies using cached uv and Python installations

inputs:
  python-version:
    description: >
      Version range or exact version of a Python version to use, using SemVer's version range syntax.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Setup uv with cache
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "latest"
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install the project
      shell: bash
      run: uv sync --locked --all-extras --dev

    - name: Debug Python version
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        echo "Input python-version: $INPUT_PYTHON_VERSION"
        echo "Python version: $(python --version)"
        echo "Python location: $(which python)"
        echo "uv Python version: $(uv run python --version)"

    - name: Minimize uv cache
      shell: bash
      run: uv cache prune --ci

---
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the glob adds each local composite action
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      ci-deps:
        patterns:
          - "*"

  # Dev dependencies update through `duty update`
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope
    versioning-strategy: increase
    allow:
      - dependency-type: production
    groups:
      runtime-deps:
        patterns:
          - "*"
